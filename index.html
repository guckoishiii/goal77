<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>กลุ่มไก่ใต้ GOAL77 โปรโมชั่นคืนยอดเสีย</title>

<meta name="description" content="กลุ่มไก่ใต้ GOAL77 โปรโมชั่นคืนยอดเสีย">

<meta property="og:type" content="website">
<meta property="og:title" content="🐓 ไก่ลงแล้ว!! 22 คู่ชน">
<meta property="og:description" content="สนามไก่ชนตลิ่งงาม เกาะสมุย">
<meta property="og:image" content="https://guckoishiii.github.io/goal77/og-image.jpg">
<meta property="og:url" content="https://guckoishiii.github.io/goal77/">

<meta name="twitter:card" content="summary_large_image">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="wrap">

<img src="logo.png" class="logo" alt="GOAL77 Logo">     

<p class="brand" id="brand"></p>

<p class="location" id="stadium"></p>

<h1 id="status"></h1>

<h2 id="pairs"></h2>

<img id="poster"
class="poster"
alt="Poster">

<a id="line"
class="btn">
📲 เข้ากลุ่ม LINE
</a>

</div>

<script src="config.js"></script>

<script>

document.getElementById("brand").textContent = DATA.brand;

document.getElementById("stadium").textContent = DATA.stadium;

document.getElementById("pairs").textContent = DATA.pairs + " คู่ชน";

document.getElementById("poster").src = DATA.image;

document.getElementById("line").href = DATA.line;

switch(DATA.status){

case 1:

document.getElementById("status").textContent="🐣 ไก่กำลังเคียง";

break;

case 2:

document.getElementById("status").textContent=
"🐥 ตอนนี้เคียงได้ "+DATA.pairs+" คู่ มีเคียงเพิ่ม";

document.getElementById("pairs").style.display="none";

break;

default:

document.getElementById("status").textContent="🐓 ไก่ลงแล้ว!!";

}

</script>
     
</body>
</html>
