<!DOCTYPE html>
<html lang="th">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GOAL77 Admin v2.2 FINAL</title>

    <link rel="stylesheet" href="admin.css">

</head>

<body>

<div class="container">

    <h1>🐓 GOAL77 Admin v2.2 FINAL</h1>

    <div class="card">

        <label>ชื่อสนาม</label>

        <input
            type="text"
            id="stadium"
            placeholder="เช่น สนามไก่ชนหลานตาแหล้ม">

        <label>Status</label>

        <select id="status">

            <option value="1">
                🐣 ไก่กำลังเคียง
            </option>

            <option value="2">
                🐥 ตอนนี้เคียงได้ XX คู่ มีเคียงเพิ่ม
            </option>

            <option value="3">
                ✅ สรุปไก่ทั้งหมด XX คู่ !!!
            </option>

            <option value="4" selected>
                🐓 ไก่ลงแล้ว!!
            </option>

        </select>

        <label>จำนวนคู่ชน</label>

        <input
            type="number"
            id="pairs"
            value="22">

        <label>Poster (og-image.jpg)</label>

        <input
            type="file"
            id="image"
            accept="image/*">

        <label>Version (v=)</label>

        <input
            type="text"
            id="imageVersion">

        <hr>

        <h2>Preview</h2>

        <div class="preview">

            <div class="preview-brand">
                กลุ่มไก่ใต้ GOAL77 โปรโมชั่นคืนยอดเสีย
            </div>

            <div
                id="previewStadium"
                class="preview-stadium">
            </div>

            <h2 id="previewStatus"></h2>

            <img
                id="previewImage"
                src="og-image.jpg">

        </div>

        <hr>

        <h2>GitHub</h2>

        <input
            type="password"
            id="githubToken"
            placeholder="GitHub Personal Access Token">

        <button
            id="publish"
            class="publish">

            🚀 Publish

        </button>

        <div id="progress"></div>

        <div id="publishLog"></div>

    </div>

</div>

<script src="template.js"></script>

<script src="github.js"></script>

<script src="admin.js"></script>

</body>
</html>
