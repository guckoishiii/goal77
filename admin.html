<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GOAL77 Admin v2.1 FINAL</title>

<link rel="stylesheet" href="admin.css">

</head>

<body>

<div class="container">

    <h1>GOAL77 Admin v2.1 FINAL</h1>

    <div class="card">

        <label>ชื่อสนาม</label>

        <input
            type="text"
            id="stadium"
            placeholder="เช่น สนามไก่ชนตลิ่งงาม เกาะสมุย">

        <label>Status</label>

        <select id="status">

            <option value="1">
                🐣 ไก่กำลังเคียง
            </option>

            <option value="2">
                🐥 ตอนนี้เคียงได้...คู่ มีเคียงเพิ่ม
            </option>

            <option value="3" selected>
                🐓 ไก่ลงแล้ว!!
            </option>

        </select>

        <label>จำนวนคู่ชน</label>

        <input
            type="number"
            id="pairs"
            value="22">

        <label>รูปโปรโมต (og-image.jpg)</label>

        <input
            type="file"
            id="image"
            accept="image/*">

        <hr>

        <h2>Preview</h2>

        <div class="preview">

            <p class="preview-brand">

                กลุ่มไก่ใต้ GOAL77 โปรโมชั่นคืนยอดเสีย

            </p>

            <p
                id="previewStadium"
                class="preview-stadium">

                -

            </p>

            <h3
                id="previewStatus">

                🐓 ไก่ลงแล้ว!!

            </h3>

            <h4
                id="previewPairs">

                📋 สรุปไก่ทั้งหมด 22 คู่ชน

            </h4>

            <img
                id="previewImage"
                src="og-image.jpg"
                alt="Preview">

        </div>

        <button id="generate">

            Generate config.js

        </button>

    </div>

</div>

<script src="admin.js"></script>

</body>

</html>
